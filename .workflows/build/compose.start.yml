# ==============================================================================
# Comptasse Production Smoke Test
# ==============================================================================
# Runs the production Docker images against local infrastructure to verify
# startup correctness. Use this after `just build images`.
#
# Usage:
#   just build start
#   # or manually:
#   COMPTASSE_VERSION=$(cat VERSION) docker compose -f .workflows/build/compose.start.yml \
#     --project-name comptasse-prod up
# ==============================================================================

services:
  # ============================================================================
  # Infrastructure (same as dev)
  # ============================================================================

  postgres:
    container_name: comptasse-prod-postgres
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: default
    ports:
      - "${PROD_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 10s
      timeout: 5s
      retries: 5

  rustfs:
    container_name: comptasse-prod-rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
    ports:
      - "${PROD_STORAGE_PORT:-9000}:9000"
      - "${PROD_STORAGE_UI_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9000 2>&1 | grep -q '403 Forbidden' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Production images (pre-built via `just build images`)
  # ============================================================================

  api:
    container_name: comptasse-prod-api
    image: comptasse-api:${COMPTASSE_VERSION:-dev}
    ports:
      - "3000:3000"
    environment:
      ENV: production
      VERBOSE: "false"
      PORT: "3000"
      CORS_ORIGIN: http://localhost:5173
      COOKIES_DOMAIN: localhost
      COOKIES_KEY: development-secret-key-change-in-production-min-32-chars
      USER_SESSION_COOKIE_MAX_AGE: "31536000"
      API_BASE_URL: http://localhost:3000
      WEBSITE_BASE_URL: http://localhost:5173
      DASHBOARD_BASE_URL: http://localhost:5174
      SQL_DATABASE_URL: postgres://postgres:admin@postgres:5432/default
      STORAGE_ENDPOINT: http://rustfs:9000
      STORAGE_BUCKET_NAME: comptasse-files
      STORAGE_ACCESS_KEY: rustfsadmin
      STORAGE_SECRET_KEY: rustfsadmin
      STORAGE_REGION: fr-par
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  dashboard:
    container_name: comptasse-prod-dashboard
    image: comptasse-dashboard:${COMPTASSE_VERSION:-dev}
    ports:
      - "5174:80"
    depends_on:
      - api

  website:
    container_name: comptasse-prod-website
    image: comptasse-website:${COMPTASSE_VERSION:-dev}
    ports:
      - "5173:80"

volumes:
  postgres_data:
  rustfs_data: