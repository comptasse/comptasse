worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  server {
    listen 80 default_server;

    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE6";
    gzip_min_length   256;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript font/woff2;
    gzip_comp_level   9;

    root /usr/share/nginx/html;

    # TLS is terminated upstream: never emit scheme/host-bearing redirects.
    absolute_redirect off;
    port_in_redirect off;

    # Redirect-only routes: these URLs throw redirect() in the SPA router,
    # so serve the same redirects statically (never prerendered).
    location = /cli {
      return 301 https://github.com/comptasse/comptasse/releases/latest;
    }
    # /cli is a redirect only; CLI installation uses /cli/install.sh below.
    location = /cli/ {
      return 301 https://github.com/comptasse/comptasse/releases/latest;
    }
    location = /documentation {
      return 301 /documentation/fonctionnalit%C3%A9s;
    }
    location = /documentation/ {
      return 301 /documentation/fonctionnalit%C3%A9s;
    }
    location = /documentation/guide {
      return 301 /documentation/guide/d%C3%A9marrer;
    }
    location = /documentation/guide/ {
      return 301 /documentation/guide/d%C3%A9marrer;
    }

    # Auth screens: not for search engines, served from the SPA shell.
    location ~ ^/(connexion|inscription|mot-de-passe-oublié)/?$ {
      add_header X-Robots-Tag "noindex, follow" always;
      add_header Cache-Control "no-cache";
      try_files /__app.html =404;
    }

    # HTML and other mutable files - always revalidate.
    # Use a blank SPA shell (__app.html) as the fallback for routes that
    # have no prerendered file (e.g. /dashboard).  index.html contains
    # the prerendered home page and must not be served as a catch-all.
    location / {
      index index.html;
      add_header Cache-Control "no-cache";
      # No "$uri/" here: letting nginx auto-redirect directories would chain
      # with the trailing-slash rule below.
      try_files $uri $uri/index.html /__app.html =404;
    }
    location = /favicon.ico { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location = /og.png      { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }
    location = /og.webp     { add_header Cache-Control "public, max-age=86400"; try_files $uri =404; }

    # CLI install scripts and version file - serve as plain text, no caching.
    # Declared before the /cli/ catch-all so this regex is matched first.
    location ~* ^/cli/(.*\.sh|version)$ {
      add_header Cache-Control "no-cache";
      add_header Content-Type "text/plain; charset=utf-8";
      try_files $uri =404;
    }

    # Unknown /cli/* paths must not fall through to the SPA shell.
    location ~ ^/cli/ {
      return 404;
    }

    # Trailing slashes: canonical URLs never end with "/".  Any /path/ that no
    # exact, `^~` or earlier regex location handled is 301-redirected to /path
    # in a single hop (query string preserved).  "/" and /migrations/ are exempt.
    location ~ ^/(.+?)/+$ {
      return 301 /$1$is_args$args;
    }

    # SQL migration files for the current release - browsable folder tree, no caching
    location = /migrations { return 301 /migrations/; }
    location ^~ /migrations/ {
      alias /usr/share/nginx/html/migrations/;
      autoindex on;
      types { text/plain sql; }
      add_header Cache-Control "no-cache";
    }

    # Immutable hashed assets (JS, CSS, fonts, images) - cache for 1 year
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|webmanifest)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
  }

  # www.comptasse.com is not a site: 301 every URL to the apex domain.
  # Requires the upstream load balancer to route www traffic to this
  # container (keeping the original Host header) and to serve a TLS
  # certificate that includes www.comptasse.com.  Until then, www stays
  # unreachable and only the 404 can be fixed at the DNS/LB level.
  server {
    listen 80;
    server_name www.comptasse.com;

    absolute_redirect off;
    port_in_redirect off;

    return 301 https://comptasse.com$request_uri;
  }
}
