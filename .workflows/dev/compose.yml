# ==============================================================================
# Comptasse Application - Development Environment
# ==============================================================================
# Docker Compose configuration for local development
#
# Architecture:
# - Full workspace: bind-mounted from host (including node_modules)
# - Dependencies must be installed on the host (`pnpm install`)
# - Infrastructure: PostgreSQL, RustFS (S3)
# - Services: API, Website
#
# Usage:
#   docker compose -f .workflows/dev/compose.yml up -d     # Start all services
#   docker compose -f .workflows/dev/compose.yml down      # Stop all services
#   docker compose -f .workflows/dev/compose.yml logs -f   # View logs
# ==============================================================================

services:
  # ============================================================================
  # Infrastructure Services
  # ============================================================================

  # PostgreSQL - Relational database for application data
  postgres:
    container_name: comptasse-postgres
    image: postgres:18.1
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: default
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT}:5432"
    networks:
      default:
        aliases:
          - postgres.comptasse.localhost
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d default"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RustFS - S3-compatible object storage for files
  rustfs:
    container_name: comptasse-rustfs
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_CONSOLE_ENABLE: true
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
    ports:
      - "${STORAGE_HOST_PORT}:9000"
      - "${RUSTFS_UI_HOST_PORT}:9001"
    networks:
      default:
        aliases:
          - rustfs.comptasse.localhost
          - storage.comptasse.localhost
    volumes:
      - rustfs_data:/data
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:9000 2>&1 | grep -q '403 Forbidden' && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Application Services
  # ============================================================================

  # API - Backend service (Hono framework on Node.js)
  api:
    container_name: comptasse-api
    image: comptasse-dev-api:latest
    build:
      context: ../..
      dockerfile: .workflows/dev/packages/api/Dockerfile
      args:
        NODE_VERSION: "25.2.1"
        PNPM_VERSION: "11.28.2"
    network_mode: host
    volumes:
      - ../..:/workspace:cached
    environment:
      # API environment (packages/api)
      ENV: development
      VERBOSE: "true"
      PORT: "${API_HOST_PORT}"
      CORS_ORIGIN: localhost
      COOKIES_DOMAIN: localhost
      COOKIES_KEY: development-secret-key-change-in-production-min-32-chars
      USER_SESSION_COOKIE_MAX_AGE: "31536000"
      API_BASE_URL: "http://localhost:${API_HOST_PORT}"
      WEBSITE_BASE_URL: "http://localhost:${WEBSITE_HOST_PORT}"
      DASHBOARD_BASE_URL: "http://localhost:${DASHBOARD_HOST_PORT}"
      SQL_DATABASE_URL: "postgres://postgres:admin@localhost:${POSTGRES_HOST_PORT}/default"
      STORAGE_ENDPOINT: "http://localhost:${STORAGE_HOST_PORT}"
      STORAGE_BUCKET_NAME: comptasse-files
      STORAGE_ACCESS_KEY: rustfsadmin
      STORAGE_SECRET_KEY: rustfsadmin
      OCR_API_KEY: ""
      OCR_ENDPOINT: "https://api.mistral.ai/v1/ocr"
      OCR_MODEL: "mistral-ocr-latest"
      # Tools environment (packages/tools) - used by migrate/seed
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:' + process.env.PORT, r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Website - Frontend interface (React + Vite)
  website:
    container_name: comptasse-website
    image: comptasse-dev-website:latest
    build:
      context: ../..
      dockerfile: .workflows/dev/packages/website/Dockerfile
      args:
        NODE_VERSION: "25.2.1"
        PNPM_VERSION: "11.28.2"
    networks:
      default:
        aliases:
          - website.comptasse.localhost
    volumes:
      - ../..:/workspace:cached
    ports:
      - "127.0.0.1:${WEBSITE_HOST_PORT}:5173"
    environment:
       # Vite reads VITE_* from process.env (injected directly by Compose).
       VITE_ENV: development
       VITE_API_BASE_URL: "http://localhost:${API_HOST_PORT}"
       VITE_WEBSITE_BASE_URL: "http://localhost:${WEBSITE_HOST_PORT}"
       VITE_DASHBOARD_BASE_URL: "http://localhost:${DASHBOARD_HOST_PORT}"
       # Host path of the repository checkout (used by the served install.sh).
       COMPTASSE_REPO_ROOT: "${COMPTASSE_REPO_ROOT:-}"

  # Dashboard - SPA dashboard interface (React + Vite)
  dashboard:
    container_name: comptasse-dashboard
    image: comptasse-dev-dashboard:latest
    build:
      context: ../..
      dockerfile: .workflows/dev/packages/dashboard/Dockerfile
      args:
        NODE_VERSION: "25.2.1"
        PNPM_VERSION: "11.28.2"
    networks:
      default:
        aliases:
          - dashboard.comptasse.localhost
    volumes:
      - ../..:/workspace:cached
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT}:5174"
    environment:
      # Vite reads VITE_* from process.env (injected directly by Compose).
      VITE_ENV: development
      VITE_API_BASE_URL: "http://localhost:${API_HOST_PORT}"

# ==============================================================================
# Named Volumes (Persistent infrastructure data)
# ==============================================================================
volumes:
  postgres_data:
  rustfs_data:
