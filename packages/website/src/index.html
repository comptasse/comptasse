<!doctype html>
<html lang="fr">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport"
            content="height=device-height, width=device-width, initial-scale=1.0, minimum-scale=1.0, target-densitydpi=device-dpi">
        <meta name="color-scheme" content="only light" />
        <meta name="theme-color" content="#ffffff" />

        <meta name="apple-mobile-web-app-title" content="Comptasse" />
        <link rel="icon" type="image/x-icon" href="/favicon.ico">

        <meta name="keywords"
            content="comptabilité, open source, association, entreprise, gestion, comptable, bilan, compte de résultat, france, française, logiciel comptabilité">

        <!-- Static social image, shared by every page. -->
        <meta property="og:image" content="https://comptasse.com/og.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image" content="https://comptasse.com/og.webp" />
        <meta property="og:image:type" content="image/webp" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta name="twitter:image" content="https://comptasse.com/og.png" />

        <!-- Per-page SEO. The prerender plugin replaces everything between the
             markers with the route's title, description, canonical and
             OG/Twitter tags. Keeping it as a single region means a prerendered
             page can never end up with two canonical links. -->
        <!--seo:start-->
        <title>Comptasse</title>
        <meta name="description" content="Logiciel de comptabilité open source pour les entreprises et associations françaises. Gérez vos écritures, comptes et documents comptables simplement.">
        <link rel="canonical" href="https://comptasse.com/" />
        <meta property="og:title" content="Comptasse - Logiciel de comptabilité open source" />
        <meta property="og:description" content="Logiciel de comptabilité open source pour les entreprises et associations françaises. Gérez vos écritures, comptes et documents comptables simplement." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://comptasse.com/" />
        <meta property="og:locale" content="fr_FR" />
        <meta property="og:site_name" content="Comptasse" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:site" content="@comptasse" />
        <meta name="twitter:title" content="Comptasse - Logiciel de comptabilité open source" />
        <meta name="twitter:description" content="Logiciel de comptabilité open source pour les entreprises et associations françaises. Gérez vos écritures, comptes et documents comptables simplement." />
        <!--seo:end-->
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="./root.tsx"></script>
