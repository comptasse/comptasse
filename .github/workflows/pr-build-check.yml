name: PR build check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # build-ci.sh builds the production images, then runs .scripts/test.sh
      # (unit + API endpoint coverage + CLI + dashboard frontend).
      - name: Run CI build + test pipeline
        run: .scripts/build-ci.sh
